name: converge
run-name: converge ${{ inputs.stage }} @ ${{ inputs.platform_ref }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to converge
        type: choice
        required: true
        options: [dev, qa, sit, uat, prod]
      platform_ref:
        description: Commit SHA on sedemo-platform branch rendered/vm-demo/<stage>
        type: string
        required: true

permissions:
  contents: read

# One converge per stage at a time; a second dispatch queues behind the first.
concurrency:
  group: converge-${{ inputs.stage }}
  cancel-in-progress: false

env:
  STAGE: ${{ inputs.stage }}
  PLATFORM_REF: ${{ inputs.platform_ref }}
  PROXMOX_VE_ENDPOINT: https://pve01.annarchy.net:8006/
  PROXMOX_VE_INSECURE: "true"
  PROXMOX_URL: https://pve01.annarchy.net:8006
  PROXMOX_USER: vm-demo@pve
  YQ_VERSION: v4.54.1
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
  ANSIBLE_CORE_VERSION: "2.21.4"
  TOOLS_DIR: /home/runner/.cache/vm-demo
  ANSIBLE_COLLECTIONS_PATH: /home/runner/.cache/vm-demo/collections

jobs:
  converge:
    runs-on: homelab-vm-demo
    timeout-minutes: 45
    steps:
      - name: Validate platform_ref
        run: |
          if ! [[ "$PLATFORM_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::platform_ref must be a full commit SHA, got '${PLATFORM_REF}'"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: actions/checkout@v7.0.1
        with:
          repository: akuity/sedemo-platform
          ref: ${{ inputs.platform_ref }}
          path: platform
          fetch-depth: 0
          persist-credentials: false

      - name: Check platform_ref is on rendered/vm-demo/${{ inputs.stage }}
        working-directory: platform
        run: |
          git fetch --no-tags origin "refs/heads/rendered/vm-demo/${STAGE}:refs/remotes/origin/rendered/vm-demo/${STAGE}"
          if ! git merge-base --is-ancestor "$PLATFORM_REF" "origin/rendered/vm-demo/${STAGE}"; then
            echo "::error::${PLATFORM_REF} is not on rendered/vm-demo/${STAGE}"
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      # Runner pods are ephemeral, so cache the tool installs (crane, yq, the
      # Ansible venv and collections) instead of rebuilding them every run.
      - name: Restore tool cache
        id: tools
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLS_DIR }}
          key: vm-demo-tools-${{ runner.os }}-${{ env.CRANE_VERSION }}-${{ env.YQ_VERSION }}-${{ env.ANSIBLE_CORE_VERSION }}-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install crane, yq and Ansible
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TOOLS_DIR/bin"
          curl -fsSL -o "$RUNNER_TEMP/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$TOOLS_DIR/bin" crane
          curl -fsSL -o "$TOOLS_DIR/bin/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x "$TOOLS_DIR/bin/yq"
          # The stock runner image has python3 but no pip/venv, and Ubuntu 24.04
          # blocks --user pip installs (PEP 668): use a venv.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv >/dev/null
          python3 -m venv "$TOOLS_DIR/ansible-venv"
          "$TOOLS_DIR/ansible-venv/bin/pip" install -q "ansible-core==${ANSIBLE_CORE_VERSION}" requests
          "$TOOLS_DIR/ansible-venv/bin/ansible-galaxy" collection install \
            -r ansible/requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"

      - name: Put tools on PATH
        run: |
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "$TOOLS_DIR/ansible-venv/bin" >> "$GITHUB_PATH"
          if ! command -v ssh >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-client >/dev/null
          fi

      - name: Credentials
        env:
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          install -m 0600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$ANSIBLE_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          if [ -n "$GHCR_READ_TOKEN" ]; then
            printf '%s' "$GHCR_READ_TOKEN" | crane auth login ghcr.io -u token --password-stdin
          fi

      - name: Converge
        env:
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          TF_IN_AUTOMATION: "1"
        run: |
          export ANSIBLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/deploy_key"
          scripts/converge.sh "$STAGE" "$GITHUB_WORKSPACE/platform"
