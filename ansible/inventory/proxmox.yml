---
# Dynamic inventory of vm-demo VMs. Connection settings come from the environment:
#   PROXMOX_URL           https://pve01.annarchy.net:8006
#   PROXMOX_USER          vm-demo@pve
#   PROXMOX_TOKEN_ID      token ID (the part after '!')
#   PROXMOX_TOKEN_SECRET  token secret
# No IP addresses are stored in git: ansible_host comes from the guest agent.
plugin: community.proxmox.proxmox
validate_certs: false
want_facts: true
exclude_nodes: true
want_proxmox_nodes_ansible_host: false

# Stage VMs only; never the seed or baked templates.
filters:
  - >-
    'vm-demo' in (proxmox_tags_parsed | default([]))
    and 'base' not in (proxmox_tags_parsed | default([]))
    and 'seed' not in (proxmox_tags_parsed | default([]))

# Proxmox tag stage-dev becomes group tag_stage_dev.
keyed_groups:
  - key: proxmox_tags_parsed
    prefix: tag
    separator: "_"

# First non-loopback, non-link-local IPv4 reported by the guest agent. Left
# unset while the agent has no address yet; deploy.yml fails on that.
compose:
  ansible_host: >-
    (proxmox_agent_interfaces | default([]))
    | rejectattr('name', 'equalto', 'lo')
    | map(attribute='ip-addresses') | flatten
    | select('match', '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/')
    | reject('match', '^(127|169\.254)\.')
    | map('regex_replace', '/.*$', '')
    | first
